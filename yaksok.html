<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>약속알람</title>
<meta property="og:title" content="약속 알람 공유">
<meta property="og:description" content="약속을 링크로 보내면 상대방 캘린더에 알람이 자동 설정됩니다">
<meta property="og:image" content="https://easyai7.github.io/general/yaksok.png">
<meta property="og:url" content="https://easyai7.github.io/general/yaksok.html">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0A0F;
    --surface: #13131A;
    --surface2: #1A1A24;
    --border: #25252F;
    --accent: #7C6EFA;
    --accent2: #FA6E9A;
    --accent3: #6EFAC8;
    --text: #EFEFEF;
    --muted: #808090;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 18px;
    min-height: 100vh;
  }

  /* ── 공통 배경 ── */
  .bg-glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 20%, rgba(124,110,250,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 80%, rgba(250,110,154,0.10) 0%, transparent 60%);
  }

  .wrap { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 0 20px 80px; }

  /* ── 화면 전환 ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ══════════════════════════════
     SENDER SCREEN (약속 만들기)
  ══════════════════════════════ */
  .sender-header {
    text-align: center;
    padding: 52px 0 36px;
    animation: fadeDown .5s ease;
  }

  .chip {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 5px 16px;
    border-radius: 20px;
    margin-bottom: 18px;
    text-transform: uppercase;
  }

  .sender-header h1 {
    font-size: clamp(34px, 8vw, 50px);
    font-weight: 900;
    line-height: 1.2;
    letter-spacing: -1px;
  }

  .sender-header h1 span {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .sender-header p { color: var(--muted); font-size: 17px; margin-top: 10px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 16px;
    animation: fadeUp .5s ease both;
  }

  .card-label {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }

  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }

  label {
    display: block;
    font-size: 15px;
    font-weight: 500;
    color: var(--muted);
    margin-bottom: 7px;
    letter-spacing: .3px;
  }

  input, textarea, select {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 17px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }

  input:focus, textarea:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,110,250,.15);
  }

  input[type="datetime-local"] { color-scheme: dark; }

  textarea { resize: vertical; min-height: 80px; line-height: 1.6; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* 알람 옵션 */
  .alarm-options {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .alarm-opt {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    font-size: 15px;
    font-weight: 500;
  }

  .alarm-opt:hover { border-color: var(--accent); }
  .alarm-opt.selected {
    border-color: var(--accent);
    background: rgba(124,110,250,.15);
    color: var(--accent);
    font-weight: 700;
  }

  .alarm-opt .opt-icon { font-size: 20px; margin-bottom: 5px; }

  /* 버튼 */
  .btn-primary {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 18px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    letter-spacing: .3px;
  }

  .btn-primary:hover { opacity: .9; transform: translateY(-1px); }
  .btn-primary:active { transform: scale(.98); }

  /* 링크 생성 결과 */
  .link-result {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    text-align: center;
    animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both;
  }

  .link-icon { font-size: 48px; margin-bottom: 12px; }

  .link-result h2 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .link-result p { color: var(--muted); font-size: 16px; margin-bottom: 20px; }

  .link-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 15px;
    color: var(--accent);
    word-break: break-all;
    text-align: left;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .btn-copy {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--accent);
    color: var(--accent);
    border-radius: 12px;
    padding: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    margin-bottom: 10px;
  }

  .btn-copy:hover { background: rgba(124,110,250,.15); }

  .btn-share {
    width: 100%;
    background: #FEE500;
    border: none;
    color: #3A1D1D;
    border-radius: 12px;
    padding: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
  }

  .btn-share:hover { opacity: .9; }

  .btn-new {
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 12px;
    padding: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    cursor: pointer;
    margin-top: 10px;
    transition: all .2s;
  }

  .btn-new:hover { border-color: var(--muted); color: var(--text); }

  /* ══════════════════════════════
     RECEIVER SCREEN (알람 받기)
  ══════════════════════════════ */
  .receiver-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
  }

  .event-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px 28px;
    width: 100%;
    max-width: 420px;
    animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
  }

  .event-emoji { font-size: 56px; margin-bottom: 16px; }

  .event-title {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -.5px;
    margin-bottom: 6px;
  }

  .event-from {
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  .event-from span { color: var(--accent); font-weight: 600; }

  .info-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 28px;
    text-align: left;
  }

  .info-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--surface2);
    border-radius: 12px;
    padding: 14px 16px;
  }

  .info-icon { font-size: 20px; flex-shrink: 0; margin-top: 1px; }

  .info-content { flex: 1; }

  .info-key {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 3px;
  }

  .info-val {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.4;
  }

  .alarm-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(124,110,250,.15);
    border: 1px solid rgba(124,110,250,.3);
    color: var(--accent);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 24px;
  }

  /* 알람 설정 버튼 */
  .btn-alarm {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 20px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 19px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    position: relative;
    overflow: hidden;
  }

  .btn-alarm:hover { opacity: .9; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(124,110,250,.3); }
  .btn-alarm:active { transform: scale(.98); }

  .btn-alarm.done {
    background: linear-gradient(135deg, #2ECC71, #27AE60);
    cursor: default;
    transform: none;
  }

  /* 알람 완료 */
  .alarm-done-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 28px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both;
  }

  .done-icon { font-size: 64px; margin-bottom: 16px; }
  .done-title { font-size: 26px; font-weight: 900; margin-bottom: 8px; }
  .done-sub { color: var(--muted); font-size: 17px; line-height: 1.6; }

  .countdown-box {
    background: var(--surface2);
    border-radius: 16px;
    padding: 20px;
    margin: 20px 0;
  }

  .countdown-label { font-size: 15px; color: var(--muted); margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; }

  .countdown-time {
    font-size: 38px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-variant-numeric: tabular-nums;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--accent);
    color: #fff;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 17px;
    font-weight: 700;
    transition: transform .3s ease;
    z-index: 999;
    white-space: nowrap;
    pointer-events: none;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }


  /* 캘린더 버튼 */
  .cal-guide {
    font-size: 15px;
    color: var(--muted);
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .btn-gcal {
    width: 100%;
    background: #fff;
    border: none;
    color: #1a73e8;
    border-radius: 16px;
    padding: 18px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-gcal:hover { opacity: .9; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(26,115,232,.3); }

  .btn-ical {
    width: 100%;
    background: #1c1c1e;
    border: 1px solid #3a3a3c;
    color: #fff;
    border-radius: 16px;
    padding: 18px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s;
    margin-bottom: 12px;
  }
  .btn-ical:hover { opacity: .9; transform: translateY(-1px); }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.9); }
    to   { opacity: 1; transform: scale(1); }
  }

  .pulse {
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
</style>
</head>
<body>
<div class="bg-glow"></div>

<!-- ══ SENDER SCREEN ══ -->
<div class="screen active" id="senderScreen">
  <div class="wrap">
    <div class="sender-header">
      <div class="chip">약속 알람</div>
      <h1>약속을 만들고<br><span>링크로 공유</span>하세요</h1>
      <p>상대방이 링크를 열면 알람이 자동 설정됩니다</p>
    </div>

    <!-- 약속 정보 -->
    <div class="card" style="animation-delay:.1s">
      <div class="card-label">📌 약속 정보</div>
      <div class="field">
        <label>약속 제목</label>
        <input type="text" id="s_title" placeholder="예: 팀 점심 모임, 병원 예약">
      </div>
      <div class="row">
        <div class="field">
          <label>날짜 & 시간</label>
          <input type="datetime-local" id="s_datetime">
        </div>
        <div class="field">
          <label>장소</label>
          <input type="text" id="s_location" placeholder="강남역 2번 출구">
        </div>
      </div>
      <div class="field">
        <label>메모 (선택)</label>
        <textarea id="s_memo" placeholder="추가 안내사항을 입력하세요"></textarea>
      </div>
      <div class="field">
        <label>보내는 사람 이름</label>
        <input type="text" id="s_sender" placeholder="예: 김철수">
      </div>
    </div>

    <!-- 알람 시간 설정 -->
    <div class="card" style="animation-delay:.2s">
      <div class="card-label">⏰ 사전 알람 시간</div>
      <div class="alarm-options">
        <div class="alarm-opt" onclick="selectAlarm(this, 30)">
          <div class="opt-icon">🔔</div>
          30분 전
        </div>
        <div class="alarm-opt selected" onclick="selectAlarm(this, 60)">
          <div class="opt-icon">⏰</div>
          1시간 전
        </div>
        <div class="alarm-opt" onclick="selectAlarm(this, 120)">
          <div class="opt-icon">🕐</div>
          2시간 전
        </div>
        <div class="alarm-opt" onclick="selectAlarm(this, 360)">
          <div class="opt-icon">📅</div>
          6시간 전
        </div>
        <div class="alarm-opt" onclick="selectAlarm(this, 1440)">
          <div class="opt-icon">🌙</div>
          하루 전
        </div>
        <div class="alarm-opt" onclick="selectAlarm(this, 2880)">
          <div class="opt-icon">📆</div>
          이틀 전
        </div>
      </div>
    </div>

    <!-- 링크 생성 버튼 -->
    <button class="btn-primary" onclick="generateLink()">🔗 약속 링크 만들기</button>

    <!-- 결과 -->
    <div id="linkResult" style="display:none; margin-top:16px">
      <div class="link-result">
        <div class="link-icon">🎉</div>
        <h2>링크가 생성됐어요!</h2>
        <p>아래 링크를 복사해서 상대방에게 보내세요<br>링크를 열면 알람이 자동 설정됩니다</p>
        <div class="link-box" id="generatedLink"></div>
        <button class="btn-copy" onclick="copyLink()">📋 링크 복사하기</button>
        <button class="btn-share" onclick="shareKakao()">💛 카카오톡으로 공유</button>
        <button class="btn-new" onclick="resetForm()">+ 새 약속 만들기</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ RECEIVER SCREEN ══ -->
<div class="screen" id="receiverScreen">
  <div class="receiver-wrap" id="receiverContent"></div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
  let selectedAlarmMin = 60;
  let countdownTimer = null;
  let currentEventData = null;

  // ── 알람 옵션 선택 ──
  function selectAlarm(el, min) {
    document.querySelectorAll('.alarm-opt').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    selectedAlarmMin = min;
  }

  // ── 링크 생성 ──
  function generateLink() {
    const title    = document.getElementById('s_title').value.trim();
    const datetime = document.getElementById('s_datetime').value;
    const location = document.getElementById('s_location').value.trim();
    const memo     = document.getElementById('s_memo').value.trim();
    const sender   = document.getElementById('s_sender').value.trim();

    if (!title)    { showToast('약속 제목을 입력해주세요'); return; }
    if (!datetime) { showToast('날짜와 시간을 입력해주세요'); return; }

    const data = {
      title,
      datetime,
      location,
      memo,
      sender,
      alarmMin: selectedAlarmMin
    };

    const encoded = btoa(encodeURIComponent(JSON.stringify(data)));
    const url = `${window.location.href.split('?')[0]}?event=${encoded}`;

    document.getElementById('generatedLink').textContent = url;
    document.getElementById('linkResult').style.display = 'block';
    document.getElementById('linkResult').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ── 링크 복사 ──
  function copyLink() {
    const link = document.getElementById('generatedLink').textContent;
    navigator.clipboard.writeText(link).then(() => showToast('링크가 복사됐어요! ✓'));
  }

  // ── 카카오 공유 (Web Share API 폴백) ──
  function shareKakao() {
    const link = document.getElementById('generatedLink').textContent;
    if (navigator.share) {
      navigator.share({ title: '약속 알람', text: '약속이 있어요! 링크를 열어서 알람을 설정해주세요 🔔', url: link });
    } else {
      navigator.clipboard.writeText(link).then(() => showToast('링크 복사됨! 카카오톡에 붙여넣기 하세요'));
    }
  }

  // ── 폼 초기화 ──
  function resetForm() {
    document.getElementById('s_title').value = '';
    document.getElementById('s_datetime').value = '';
    document.getElementById('s_location').value = '';
    document.getElementById('s_memo').value = '';
    document.getElementById('s_sender').value = '';
    document.getElementById('linkResult').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ── 수신자 화면 렌더 ──
  function renderReceiver(data) {
    currentEventData = data;
    document.getElementById('senderScreen').classList.remove('active');
    document.getElementById('receiverScreen').classList.add('active');

    const dt = new Date(data.datetime);
    const alarmTime = new Date(dt.getTime() - data.alarmMin * 60 * 1000);
    const now = new Date();

    const dateStr = dt.toLocaleDateString('ko-KR', {
      year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
    });
    const timeStr = dt.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    const alarmStr = alarmTime.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    const alarmLabel = data.alarmMin >= 1440
      ? `${data.alarmMin / 1440}일 전`
      : data.alarmMin >= 60
        ? `${data.alarmMin / 60}시간 전`
        : `${data.alarmMin}분 전`;

    const isPast = alarmTime <= now;

    const content = document.getElementById('receiverContent');
    content.innerHTML = `
      <div class="event-card">
        <div class="event-emoji pulse">📅</div>
        <div class="event-title">${data.title}</div>
        <div class="event-from">${data.sender ? `<span>${data.sender}</span>님이 약속을 보냈어요` : '약속이 도착했어요'}</div>

        <div class="info-grid">
          <div class="info-row">
            <div class="info-icon">🗓</div>
            <div class="info-content">
              <div class="info-key">날짜</div>
              <div class="info-val">${dateStr}</div>
            </div>
          </div>
          <div class="info-row">
            <div class="info-icon">🕐</div>
            <div class="info-content">
              <div class="info-key">시간</div>
              <div class="info-val">${timeStr}</div>
            </div>
          </div>
          ${data.location ? `
          <div class="info-row">
            <div class="info-icon">📍</div>
            <div class="info-content">
              <div class="info-key">장소</div>
              <div class="info-val">${data.location}</div>
            </div>
          </div>` : ''}
          ${data.memo ? `
          <div class="info-row">
            <div class="info-icon">💬</div>
            <div class="info-content">
              <div class="info-key">메모</div>
              <div class="info-val">${data.memo}</div>
            </div>
          </div>` : ''}
        </div>

        <div class="cal-guide">📲 아래 버튼을 누르면 내 폰 캘린더에 자동 저장돼요</div>

        <button class="btn-gcal" onclick="addGoogleCal(currentEventData)">
          <img src="https://ssl.gstatic.com/calendar/images/dynamiclogo_2020q4/calendar_20_2x.png" style="width:22px;height:22px;vertical-align:middle;margin-right:8px;border-radius:4px;">구글 캘린더에 저장
        </button>

        <button class="btn-ical" onclick="addIcal(currentEventData)">
          🍎 아이폰 캘린더에 저장 (.ics)
        </button>
      </div>
    `;
  }


  // ── 구글 캘린더 추가 ──
  function addGoogleCal(data) {
    const dt = new Date(data.datetime);
    const end = new Date(dt.getTime() + 60 * 60 * 1000); // 1시간 후

    function fmt(d) {
      return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    }

    const params = new URLSearchParams({
      action: 'TEMPLATE',
      text: data.title,
      dates: fmt(dt) + '/' + fmt(end),
      details: data.memo || '',
      location: data.location || '',
    });

    window.open('https://calendar.google.com/calendar/render?' + params.toString(), '_blank');
  }

  // ── 애플(.ics) 캘린더 추가 ──
  function addIcal(data) {
    const dt = new Date(data.datetime);
    const end = new Date(dt.getTime() + 60 * 60 * 1000);

    function fmt(d) {
      return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    }

    const alarmMin = data.alarmMin || 60;
    const ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'BEGIN:VEVENT',
      'SUMMARY:' + data.title,
      'DTSTART:' + fmt(dt),
      'DTEND:' + fmt(end),
      'LOCATION:' + (data.location || ''),
      'DESCRIPTION:' + (data.memo || ''),
      'BEGIN:VALARM',
      'TRIGGER:-PT' + alarmMin + 'M',
      'ACTION:DISPLAY',
      'DESCRIPTION:' + data.title + ' 알람',
      'END:VALARM',
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n');

    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = data.title + '.ics';
    a.click();
    URL.revokeObjectURL(url);
  }

  // ── 알람 설정 ──
  function setAlarm(datetimeStr, alarmMin) {
    const dt = new Date(datetimeStr);
    const alarmTime = new Date(dt.getTime() - alarmMin * 60 * 1000);
    const now = new Date();
    const msUntilAlarm = alarmTime - now;

    if (msUntilAlarm <= 0) {
      showToast('알람 시간이 이미 지났어요');
      return;
    }

    // 알람 설정
    if ('Notification' in window) {
      Notification.requestPermission().then(perm => {
        if (perm === 'granted') {
          setTimeout(() => {
            new Notification('⏰ 약속 알람!', {
              body: `곧 약속이 있어요! ${dt.toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'})} 약속을 잊지 마세요 🔔`,
              icon: '⏰'
            });
          }, msUntilAlarm);
          showAlarmDone(alarmTime, dt, alarmMin);
        } else {
          // 알림 권한 없으면 카운트다운만
          showAlarmDone(alarmTime, dt, alarmMin);
          showToast('브라우저 알림 권한을 허용하면 더 정확해요');
        }
      });
    } else {
      showAlarmDone(alarmTime, dt, alarmMin);
    }
  }

  // ── 알람 완료 화면 ──
  function showAlarmDone(alarmTime, eventTime, alarmMin) {
    const alarmLabel = alarmMin >= 1440
      ? `${alarmMin / 1440}일 전`
      : alarmMin >= 60
        ? `${alarmMin / 60}시간 전`
        : `${alarmMin}분 전`;

    const content = document.getElementById('receiverContent');
    content.innerHTML = `
      <div class="alarm-done-card">
        <div class="done-icon">✅</div>
        <div class="done-title">알람이 설정됐어요!</div>
        <div class="done-sub">
          약속 <strong>${alarmLabel}</strong>인<br>
          <strong>${alarmTime.toLocaleString('ko-KR', {month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'})}</strong>에<br>
          알람이 울릴 거예요 🔔
        </div>
        <div class="countdown-box">
          <div class="countdown-label">알람까지 남은 시간</div>
          <div class="countdown-time" id="countdown">계산 중...</div>
        </div>
        <div class="done-sub" style="font-size:12px; color: var(--muted)">
          ⚠️ 이 페이지를 열어두거나 브라우저 알림을 허용해야 알람이 울려요
        </div>
      </div>
    `;

    startCountdown(alarmTime);
  }

  // ── 카운트다운 ──
  function startCountdown(alarmTime) {
    if (countdownTimer) clearInterval(countdownTimer);

    function tick() {
      const now = new Date();
      const diff = alarmTime - now;
      const el = document.getElementById('countdown');
      if (!el) { clearInterval(countdownTimer); return; }

      if (diff <= 0) {
        el.textContent = '🔔 알람!';
        clearInterval(countdownTimer);
        return;
      }

      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);

      if (d > 0) el.textContent = `${d}일 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      else el.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  // ── Toast ──
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  // ── URL 파싱 (수신자 진입) ──
  function init() {
    const params = new URLSearchParams(window.location.search);
    const raw = params.get('event');
    if (raw) {
      try {
        const data = JSON.parse(decodeURIComponent(atob(raw)));
        renderReceiver(data);
      } catch(e) {
        showToast('링크가 올바르지 않아요');
      }
    } else {
      // 기본 날짜 설정
      const now = new Date();
      now.setDate(now.getDate() + 1);
      now.setHours(12, 0, 0, 0);
      document.getElementById('s_datetime').value = now.toISOString().slice(0, 16);
    }
  }

  init();
</script>
</body>
</html>
